# ============================================================
# Prometheus - RBAC + Config + Deployment + Service
# ============================================================

# ServiceAccount untuk Prometheus
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sotar
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring

---
# ClusterRole: izin scrape metrics dari seluruh cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: sotar

---
# Prometheus Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sotar
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - "/etc/prometheus/alert-rules.yml"

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "frontend"
        static_configs:
          - targets: ["frontend-service:80"]
        metrics_path: "/metrics"

      - job_name: "laravel"
        static_configs:
          - targets: ["laravel-service:80"]
        metrics_path: "/metrics"

      - job_name: "golang"
        static_configs:
          - targets: ["golang-service:8080"]
        metrics_path: "/metrics"

      - job_name: "mysql"
        static_configs:
          - targets: ["mysql-service:9104"]

      - job_name: "vault"
        metrics_path: "/v1/sys/metrics"
        params:
          format: ["prometheus"]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ["vault-service:8200"]

  alert-rules.yml: |
    groups:
      - name: application-alerts
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="sotar"}[5m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} di namespace {{ $labels.namespace }} restart lebih dari 0 kali dalam 5 menit."

          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="sotar", condition="true"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is not ready"
              description: "Pod {{ $labels.pod }} belum ready selama lebih dari 5 menit."

          - alert: HighCPUUsage
            expr: (rate(container_cpu_usage_seconds_total{namespace="sotar"}[5m])) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage pada container {{ $labels.container }}"
              description: "Container {{ $labels.container }} menggunakan lebih dari 80% CPU selama 10 menit."

          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{namespace="sotar"} / container_spec_memory_limit_bytes{namespace="sotar"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage pada container {{ $labels.container }}"
              description: "Container {{ $labels.container }} menggunakan lebih dari 85% memory."

      - name: mysql-alerts
        rules:
          - alert: MySQLDown
            expr: mysql_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "MySQL database is down"
              description: "MySQL instance tidak merespons selama lebih dari 1 menit."

          - alert: MySQLSlowQueries
            expr: rate(mysql_global_status_slow_queries[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "MySQL slow queries detected"
              description: "MySQL mengalami slow queries lebih dari 0.1/detik."

      - name: vault-alerts
        rules:
          - alert: VaultSealed
            expr: vault_core_unsealed == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Vault is sealed"
              description: "HashiCorp Vault dalam keadaan sealed dan tidak bisa melayani request."

---
# Prometheus PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: sotar
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sotar
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: sotar
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30909
      protocol: TCP
      name: web
  selector:
    app: prometheus