# ============================================================
# HashiCorp Vault - RBAC + Config + PVC + Deployment + Service
# ============================================================

# ServiceAccount untuk Vault
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: sotar
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: security

---
# ClusterRole untuk Vault token review (Kubernetes Auth)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  labels:
    app.kubernetes.io/name: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: sotar

---
# Vault Server Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: sotar
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: security
data:
  vault-config.hcl: |
    ui = true
    api_addr = "http://0.0.0.0:8200"
    default_lease_ttl = "168h"
    max_lease_ttl     = "720h"

  # Script inisialisasi Vault policies & secrets engine
  vault-init.sh: |
    #!/bin/sh
    set -e

    echo "⏳ Menunggu Vault ready..."
    until vault status 2>/dev/null; do
      sleep 2
    done

    echo "✅ Vault ready. Mengkonfigurasi..."

    # Enable KV Secrets Engine v2
    vault secrets enable -path=secret kv-v2 2>/dev/null || true

    # Simpan secret database
    vault kv put secret/database \
      host=mysql-service \
      port=3306 \
      database=laravel \
      username=root \
      password=root123

    # Simpan secret aplikasi
    vault kv put secret/laravel \
      app_key="base64:VMiqFlGfVMiqFlGfVEs6aWYMiFlGfVMi" \
      db_password="root123"

    vault kv put secret/golang \
      db_password="root123" \
      jwt_secret="super-secret-jwt-key-2026"

    # Buat policy untuk aplikasi
    vault policy write app-readonly - <<EOF
    path "secret/data/*" {
      capabilities = ["read", "list"]
    }
    EOF

    vault policy write app-readwrite - <<EOF
    path "secret/data/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    EOF

    # Enable Kubernetes Auth Method
    vault auth enable kubernetes 2>/dev/null || true

    vault write auth/kubernetes/config \
      kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

    # Buat role untuk Golang app
    vault write auth/kubernetes/role/golang-app \
      bound_service_account_names=vault-auth \
      bound_service_account_namespaces=sotar \
      policies=app-readonly \
      ttl=24h

    # Buat role untuk Laravel app
    vault write auth/kubernetes/role/laravel-app \
      bound_service_account_names=vault-auth \
      bound_service_account_namespaces=sotar \
      policies=app-readonly \
      ttl=24h

    echo "🎉 Vault konfigurasi selesai!"
    
    sleep infinity

---
# PersistentVolumeClaim untuk Vault data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-pvc
  namespace: sotar
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: security
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: sotar
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: security
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        app.kubernetes.io/name: vault
        app.kubernetes.io/component: security
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: vault
          image: hashicorp/vault:1.17.6
          ports:
            - containerPort: 8200
              name: vault-api
            - containerPort: 8201
              name: vault-cluster
          env:
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            # Menggunakan root token dev standar agar tidak invalid request
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "root"
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            - name: VAULT_API_ADDR
              value: "http://0.0.0.0:8200"
          args:
            - "server"
            - "-dev"
            - "-dev-root-token-id=root"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: vault-config
              mountPath: /vault/config
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

        # ---- Init Sidecar: auto-configure Vault ----
        - name: vault-init
          image: hashicorp/vault:1.17.6
          command: ["/bin/sh", "/vault/config/vault-init.sh"]
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            - name: VAULT_TOKEN
              value: "root"
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      volumes:
        - name: vault-data
          persistentVolumeClaim:
            claimName: vault-pvc
        - name: vault-config
          configMap:
            name: vault-config
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: sotar
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: security
spec:
  type: NodePort
  ports:
    - port: 8200
      targetPort: 8200
      nodePort: 30820
      protocol: TCP
      name: vault-api
  selector:
    app: vault