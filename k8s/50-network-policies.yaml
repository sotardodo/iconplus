# ============================================================
# Network Policies - Keamanan Jaringan antar Service
# ============================================================

# Default: Deny semua ingress traffic di namespace sotar
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sotar
  labels:
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow: Frontend bisa diakses dari luar (Ingress/NodePort)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP

---
# Allow: Laravel hanya bisa diakses dari Frontend dan Golang
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-laravel-from-apps
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: laravel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: golang
      ports:
        - port: 8001
          protocol: TCP
    # Traefik Ingress (kube-system) -> Laravel
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8001
          protocol: TCP

---
# Allow: Golang hanya bisa diakses dari Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-golang-from-frontend
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: golang
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8080
          protocol: TCP
    # Traefik Ingress (kube-system) -> Golang
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
          protocol: TCP

---
# Allow: MySQL hanya bisa diakses dari Laravel dan Golang
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-from-backends
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: laravel
        - podSelector:
            matchLabels:
              app: golang
      ports:
        - port: 3306
          protocol: TCP
    # Allow Prometheus scrape MySQL exporter
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9104
          protocol: TCP

---
# Allow: Vault bisa diakses dari semua app di namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-from-apps
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: golang
        - podSelector:
            matchLabels:
              app: laravel
      ports:
        - port: 8200
          protocol: TCP
    # Allow akses dari luar untuk Vault UI
    - ports:
        - port: 8200
          protocol: TCP

---
# Allow: Prometheus bisa scrape semua pod di namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9090
          protocol: TCP

---
# Allow: Grafana bisa diakses dari luar dan dari Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: sotar
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
