# ============================================================
# Golang Deployment + Service + HPA
# Image: sotar12/golang:latest
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang
  namespace: sotar
  labels:
    app.kubernetes.io/name: golang
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: golang
  template:
    metadata:
      labels:
        app: golang
        app.kubernetes.io/name: golang
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "golang-app"
    spec:
      serviceAccountName: vault-auth
      containers:
        - name: golang
          image: sotar12/golang:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: golang-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: VAULT_ADDR
              value: "http://vault-service:8200"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: golang-service
  namespace: sotar
  labels:
    app.kubernetes.io/name: golang
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: golang

---
# ============================================================
# HorizontalPodAutoscaler - Golang
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: golang-hpa
  namespace: sotar
  labels:
    app.kubernetes.io/name: golang
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: golang
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
