# ============================================================
# Secrets - Database & Vault Credentials
# ============================================================
# IMPORTANT: Untuk production, gunakan SealedSecrets / External Secrets Operator
# atau HashiCorp Vault untuk manajemen secret.
# Nilai di bawah sudah di-encode base64.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: sotar
  labels:
    app.kubernetes.io/component: database
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: cm9vdDEyMw==              # root123
  MYSQL_DATABASE: bGFyYXZlbA==                    # laravel
  MYSQL_USER: cm9vdA==                            # root
  MYSQL_PASSWORD: cm9vdDEyMw==                    # root123

---
apiVersion: v1
kind: Secret
metadata:
  name: laravel-secret
  namespace: sotar
  labels:
    app.kubernetes.io/component: laravel
type: Opaque
data:
  APP_KEY: YmFzZTY0OlZNaXFGbEdmVk1pcUZsR2ZWRXM2YVdZTWlGbEdmVk1p  # base64:VMiqFlGfVMiqFlGfVEs6aWYMiFlGfVMi
  DB_PASSWORD: cm9vdDEyMw==                                    # root123

---
apiVersion: v1
kind: Secret
metadata:
  name: vault-secret
  namespace: sotar
  labels:
    app.kubernetes.io/component: vault
type: Opaque
data:
  VAULT_DEV_ROOT_TOKEN_ID: cy5zb3Rhci12YXVsdC10b2tlbi0yMDI2  # s.sotar-vault-token-2026

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: sotar
  labels:
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  GF_SECURITY_ADMIN_USER: YWRtaW4=        # admin
  GF_SECURITY_ADMIN_PASSWORD: cm9vdDEyMw== # root123