# ============================================================
# Ingress - Routing Traffic ke Services
# Memerlukan Ingress Controller (nginx-ingress / traefik)
# ============================================================
# Install nginx-ingress controller:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sotar-ingress
  namespace: sotar
  labels:
    app.kubernetes.io/component: networking
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
spec:
  ingressClassName: nginx
  rules:
    # ---- Frontend: app.sotar.local ----
    - host: app.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # ---- Laravel API: api.sotar.local ----
    - host: api.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laravel-service
                port:
                  number: 80

    # ---- Golang API: go.sotar.local ----
    - host: go.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golang-service
                port:
                  number: 8080

    # ---- Grafana Dashboard: grafana.sotar.local ----
    - host: grafana.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000

    # ---- Vault UI: vault.sotar.local ----
    - host: vault.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-service
                port:
                  number: 8200
