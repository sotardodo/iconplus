# ============================================================
# Ingress - Routing Traffic ke Services (Traefik)
# Backend port = Service.spec.ports[].port (bukan targetPort/containerPort)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sotar-ingress
  namespace: sotar
  labels:
    app.kubernetes.io/component: networking
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    # ---- Frontend: app.sotar.local ----
    - host: app.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

    # ---- Laravel API: api.sotar.local (/api/*) ----
    - host: api.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laravel-service
                port:
                  number: 80

    # ---- Golang API: go.sotar.local (/api/*) ----
    - host: go.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golang-service
                port:
                  number: 8080

    # ---- Grafana: grafana.sotar.local ----
    - host: grafana.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000

    # ---- Prometheus: prometheus.sotar.local ----
    - host: prometheus.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090

    # ---- Vault UI: vault.sotar.local ----
    - host: vault.sotar.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault-service
                port:
                  number: 8200
