# ============================================================
# Laravel Deployment + Service + HPA
# Image: sotar12/laravel:latest
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: sotar
  labels:
    app.kubernetes.io/name: laravel
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
        app.kubernetes.io/name: laravel
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001" 
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vault-auth
      # ---- INIT CONTAINER: Tunggu DB siap lalu migrate fresh & seed ----
      initContainers:
        - name: laravel-migrate
          image: sotar12/laravel:latest
          imagePullPolicy: Always
          workingDir: /var/www/html
          command: 
            - "sh"
            - "-c"
            - |
              echo "Menunggu database MySQL siap..."
              until php -r "try { new PDO('mysql:host=mysql-service;dbname=laravel', 'root', getenv('DB_PASSWORD')); echo 'Koneksi Berhasil'; } catch (\Exception \$e) { exit(1); }"; do
                sleep 3
              done
              echo "Database siap, menjalankan migrasi..."
              php artisan migrate:fresh --seed --force
          envFrom:
            - configMapRef:
                name: laravel-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: APP_KEY
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_PASSWORD
                  optional: true
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: laravel-config
                  key: VAULT_ADDR
            - name: VAULT_ROLE
              valueFrom:
                configMapKeyRef:
                  name: laravel-config
                  key: VAULT_ROLE

      containers:
        - name: laravel
          image: sotar12/laravel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: laravel-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: APP_KEY
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_PASSWORD
                  optional: true
            - name: VAULT_ADDR
              valueFrom:
                configMapKeyRef:
                  name: laravel-config
                  key: VAULT_ADDR
            - name: VAULT_ROLE
              valueFrom:
                configMapKeyRef:
                  name: laravel-config
                  key: VAULT_ROLE
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/products
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/products
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
  namespace: sotar
  labels:
    app.kubernetes.io/name: laravel
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: laravel

---
# ============================================================
# HorizontalPodAutoscaler - Laravel
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-hpa
  namespace: sotar
  labels:
    app.kubernetes.io/name: laravel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80